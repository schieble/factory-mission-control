# Our install (AIF-172 live check): no pull request waits, so pending and scope are skipped and
# tidy must skip too, not read the output scope never wrote.
config:
  app_check: { enabled: true, trigger: frontend, frontend_paths: ["public/**", "src/views.ts"], depth: auto }
  protected_paths: [".archon/**"]
  autonomy: standard
  app: { prepare: "npm ci", start: "npm start", port_env: PORT, database_env: APP_DATABASE_PATH, health_path: "/health" }
select: { found: false, pr: null, head: "", files: [], base: "", base_oid: "", issue: null, issue_body: "", issue_labels: [] }
finalize: { recovered: false }
cleanup: { cleaned: false, app_record: false, app_cleanup: no-record, teardown: none }
fixture:
  inputs: { repo_path: example/widgets, pr: "", protected_grant: "" }
  expect: completed
  reached: [config, select, finalize, cleanup]
exec-code: true
